# CodeQL: GitHub's code scanner, over the repository's Python tools and its workflows (results under Security → Code
# scanning). CodeQL has no OCaml analyser; the kernel itself is covered by the compiler's warnings-as-errors, the
# tests, the arena corpus and the forge (forge.yml).
name: codeql
on:
  pull_request:
    branches: [main]
    paths: ["**/*.py", ".github/**", "tools/**"]
  push:
    branches: [main]
    paths: ["**/*.py", ".github/**", "tools/**"]
  schedule:
    - cron: "41 5 * * 1"   # Mondays
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, actions: read, security-events: write }   # security-events: the results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
