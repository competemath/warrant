# Mutation testing of the kernel's own tests (tools/mutate.py): change one operator in the source, rebuild, run the arena
# corpus, the regressions, a short forge round and the unit tests, and report the changes nothing noticed. Each such
# survivor is either an equivalent mutant (listed with its reason in tools/mutation_equivalents.json) or a missing test;
# a survivor that is not listed fails the run, and the fix is a pinned regression (tools/make_regressions.py).
# A different random sample every week: the seed is the run number.
name: mutation
on:
  schedule:
    - cron: "47 3 * * 3"   # Wednesdays
  workflow_dispatch:
    inputs:
      count:
        description: "Mutants to try"
        required: false
        default: "60"
permissions: {}
concurrency:
  group: mutation
  cancel-in-progress: false
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.3"
          dune-cache: true
      - run: opam install . --deps-only --with-test --yes
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Mutants
        env:
          COUNT: ${{ inputs.count || '60' }}
          SEED: ${{ github.run_number }}
        run: |
          cp -r . "$RUNNER_TEMP/mut"
          opam exec -- python3 tools/mutate.py --work "$RUNNER_TEMP/mut" --count "$COUNT" --seed "$SEED" \
            --files src/tc.ml src/ind.ml src/quot.ml src/level.ml src/expr.ml src/parser.ml src/check.ml src/prim.ml src/env.ml src/fingerprint.ml \
            --allow tools/mutation_equivalents.json --out "$RUNNER_TEMP/mutants.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants
          path: ${{ runner.temp }}/mutants.json
          if-no-files-found: ignore
