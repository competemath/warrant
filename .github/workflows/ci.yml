# The checks a pull request must pass. `ci` is the one required status check (the ruleset names it); it reports on the
# pull request and again on the merge group, and fails when any job it depends on did not succeed.
#
# Every job runs with a read-only token and drops it after checkout (persist-credentials: false). No job holds a secret.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: {}
defaults:
  run:
    shell: bash   # -e -o pipefail: a failing command before a `| tail` fails its step
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    # The kernel, its unit and property tests, and the arena corpus under tests/arena (every historical soundness bug
    # must be rejected, every valid file accepted, the `either` corner cases must not crash).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.3"
          dune-cache: true
      - name: Dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Build (warnings are errors in the dev profile)
        run: opam exec -- dune build @all
      - name: Unit and property tests
        run: opam exec -- dune test --force
      - name: Evidence discipline (no unsafe constructs, one construction site per evidence, forgeries do not compile)
        run: |
          python3 tools/lint_kernel.py
          opam exec -- python3 tools/compile_fail.py
      - name: Arena corpus and regressions
        # a file the kernel cannot finish in the time is a decline, never an accept; the manifests say which may time out
        run: python3 tools/arena.py --binary _build/default/bin/main.exe --timeout 120 --quiet tests/arena tests/regressions
      - name: Forge, a short round (random files with verdicts known by construction)
        run: python3 tools/forge/forge.py --binary _build/default/bin/main.exe --seconds 60 --out "$RUNNER_TEMP/forge" --prelude tests/arena/good/init-prelude.ndjson

  lint:
    # Formatting of the OCaml (ocamlformat, the version in .ocamlformat), and the pre-commit hooks (JSON/YAML shape,
    # merge markers, secrets, Python lint).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.3"
          dune-cache: true
      - run: opam install ocamlformat.0.29.0 --yes
      - run: opam exec -- dune build @fmt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/.cache/pre-commit, key: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}" }
      - run: pipx install pre-commit && pre-commit run --all-files --show-diff-on-failure

  ci:
    # The required check. `if: always()` so it reports when a dependency failed; the step turns that into a failure.
    needs: [build-test, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env: { RESULTS: "${{ toJSON(needs.*.result) }}" }
        run: |
          echo "$RESULTS"
          [ "$(echo "$RESULTS" | tr -d '[] \n"' | tr ',' '\n' | grep -vcx success)" = 0 ]
