# zizmor: a static analyser for GitHub Actions workflows (template injection, unpinned actions, credential
# persistence, dangerous triggers). Results under Security → Code scanning; a finding fails the run.
name: zizmor
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read, security-events: write }
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: true
