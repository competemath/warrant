# The single source of truth for local and CI linting: CI runs `pre-commit run --all-files` (ci.yml, job `lint`).
# The OCaml formatting check is `dune build @fmt` in the same job (ocamlformat has no pre-commit hook of its own).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^tests/arena/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=12000]
      - id: end-of-file-fixer
        exclude: ^tests/arena/   # export files are exact inputs, final newline or not
      - id: check-merge-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
